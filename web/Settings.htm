<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="en">

<head>
  <title>Settings - Sprinklers Pi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/sprinkler.png">
  <link rel="stylesheet" href="jquery/jquery.mobile-1.4.5.min.css" type="text/css">
  <link rel="stylesheet" href="custom.css" />
  <script src="jquery/jquery-1.9.1.min.js" type="text/javascript"></script>
  <script src="jquery/jquery.mobile-1.4.5.min.js" type="text/javascript"></script>
</head>

<body>
<div data-role="page" id="settings">
  <script type="text/javascript">

$('#settings').on('pagebeforeshow', function () {
    $.ajax("json/settings", {
        dataType: "json",
        success: function (data) {
            console.log("Settings data received:", data);  // Log the received data

            $('#settings div[data-role="fieldcontain"]').css('display','none');

            // Log each variable as it is passed to the NV function
            console.log("IP:", data.ip);
            console.log("Netmask:", data.netmask);
            console.log("Gateway:", data.gateway);
            console.log("WU IP:", data.wuip);
            console.log("API Key:", data.apikey);
            console.log("API ID:", data.apiid);
            console.log("API Secret:", data.apisecret);
            console.log("WU Type:", data.wutype);
            console.log("ZIP:", data.zip);
            console.log("PWS:", data.pws);
            console.log("Location:", data.loc);
            console.log("NTP IP:", data.NTPip);
            console.log("NTP Offset:", data.NTPoffset);
            console.log("OT:", data.ot);
            console.log("Web Port:", data.webport);
            console.log("SADJ:", data.sadj);
            console.log("Bias Temp:", data.biasTemp);
            console.log("Bias Humid:", data.biasHumid);
            console.log("Bias Rain:", data.biasRain);
            console.log("Temp Baseline:", data.tempBaseline);

            // Call NV function with the data
            NV(data, 'ip');
            NV(data, 'netmask');
            NV(data, 'gateway');
            NV(data, 'wuip');
            NV(data, 'apikey');
            NV(data, 'apiid');
            NV(data, 'apisecret');
            NV(data, 'wutype');
            NV(data, 'zip');
            NV(data, 'pws');
            NV(data, 'loc');
            NV(data, 'NTPip');
            NV(data, 'NTPoffset');
            NV(data, 'ot');
            NV(data, 'webport');
            NV(data, 'sadj');
            NV(data, 'biasTemp');
            NV(data, 'biasHumid');
            NV(data, 'biasRain');
            NV(data, 'tempBaseline');
        },
        error: function (xhr, status, error) {
            console.error("Error fetching settings:", status, error);  // Log error if the request fails
        }
    });
});


function NV(data, e) {
    // Log the function parameters (data and the current key 'e')
    console.log("NV function called with data:", data);
    console.log("Processing key:", e);

    if (e in data) {
        console.log("Key found in data:", e);

        // Log the action being performed
        console.log("Displaying the div for:", e);
        $('#settings #'+e+'div').css('display','block');

        // Handle specific cases for 'ot' and 'wutype'
        if ((e == 'ot') || (e == 'wutype')) {
            console.log("Handling radio button for:", e);

            // Uncheck all radio buttons
            $('#'+e+'div input[type="radio"]').prop("checked", false).checkboxradio("refresh");

            // Check the selected radio button based on data
            console.log("Selecting radio button:", e + data[e]);
            $("#settings #"+e+data[e]).prop("checked", true).checkboxradio("refresh");
        }
        // Handle the 'sadj' case (slider)
        else if (e == 'sadj') {
            console.log("Setting slider value for:", e, "with value:", data[e]);
            $('#settings #'+e).val(data[e]).slider('refresh');
        }
        // Handle generic case for other fields
        else {
            console.log("Setting value for:", e, "with value:", data[e]);
            $('#settings #'+e).val(data[e]);
        }
    } else {
        console.log("Key not found in data:", e);
    }
}


function settingsSubmitForm() {
  // Serialize the form data and log it
  const payload = $('#setForm').serialize();
  console.log("Form data serialized:", payload);

  // Start the AJAX request and log the request details
  console.log("Sending AJAX request to submit settings...");
  $.ajax({
    data: payload,
    type: 'get',
    url: 'bin/settings',
    success: function (d) {
      // Log the response data on success
      console.log("Settings submission successful, response:", d);
      window.history.back();
    },
    error: function (xhr, st, e) {
      // Log the error details
      console.error("Error submitting settings. Status:", st, "Error:", e);
      alert(st);
      window.history.back();
    }
  });
}


  </script>
  <div data-theme="a" data-role="header">	<a data-role="button" href="javascript:settingsSubmitForm();" data-icon="check" data-iconpos="left" class="ui-btn-right">OK</a>
    <a data-role="button" data-rel="back" href="#page1" data-icon="back" data-iconpos="left" class="ui-btn-left">Cancel</a>
    <h1>Settings</h1>
  </div> <!-- /header -->
  <div data-role="content">
    <form id="setForm" action="#">
      <div id="ipdiv" data-role="fieldcontain">
        <label for="ip">IP:</label>
        <input type="text" name="ip" id="ip" value="" maxlength=15 />
      </div>
      <div id="netmaskdiv" data-role="fieldcontain">
        <label for="netmask">Netmask:</label>
        <input type="text" name="netmask" id="netmask" value="" maxlength=15 />
      </div>
      <div id="gatewaydiv" data-role="fieldcontain">
        <label for="gateway">Gateway:</label>
        <input type="text" name="gateway" id="gateway" value="" maxlength=15 />
      </div>
      <div id="apikeydiv" data-role="fieldcontain">
        <label for="apikey">API Key:</label>
        <input type="text" name="apikey" id="apikey" value="" maxlength=64 />
      </div>
      <div id="apiiddiv" data-role="fieldcontain">
        <label for="apiid">API Id:</label>
        <input type="text" name="apiid" id="apiid" value="" maxlength=64 />
      </div>
      <div id="apisecretdiv" data-role="fieldcontain">
        <label for="apisecret">API Secret:</label>
        <input type="text" name="apisecret" id="apisecret" value="" maxlength=64 />
      </div>
      <div id="wutypediv" data-role="fieldcontain">
        <fieldset data-role="controlgroup" data-type="horizontal">
          <legend>Location Type:</legend>
          <input type="radio" name="wutype" id="wutypezip" value="zip"/>
          <label for="wutypezip">Zip</label>
          <input type="radio" name="wutype" id="wutypepws" value="pws" />
          <label for="wutypepws">PWS</label>
        </fieldset>
      </div>
      <div id="zipdiv" data-role="fieldcontain">
        <label for="zip">Zip Code:</label>
        <input type="number" name="zip" id="zip" value="" min="0" max="99999" />
      </div>
      <div id="pwsdiv" data-role="fieldcontain">
        <label for="pws">PWS ID:</label>
        <input type="text" name="pws" id="pws" value="" maxlength=11 />
      </div>
      <div id="locdiv" data-role="fieldcontain">
        <label for="loc">Location:</label>
        <input type="text" name="loc" id="loc" value="" maxlength=50 />
      </div>
      <div id="NTPipdiv" data-role="fieldcontain">
        <label for="NTPip">NTP IP:</label>
        <input type="text" name="NTPip" id="NTPip" value="" maxlength=15 />
      </div>
      <div id="NTPoffsetdiv" data-role="fieldcontain">
        <label for="NTPoffset">Timezone Offset:</label>
        <input type="number" name="NTPoffset" id="NTPoffset" value="" min="-12" max="14"/>
      </div>
      <div id="webportdiv" data-role="fieldcontain">
        <label for="zip">Web Port:</label>
        <input type="number" name="webport" id="webport" value="" min="0" max="32767" />
      </div>
      <div id="sadjdiv" data-role="fieldcontain">
        <label for="sadj">Seasonal Adjust %</label>
        <input type="range" name="sadj" id="sadj" value="" min="0" max="200" />
      </div>
      <div id="otdiv" data-role="fieldcontain">
        <fieldset data-role="controlgroup" data-type="vertical" data-mini="true">
          <legend>Output:</legend>
          <input type="radio" name="ot" id="ot0" value="0"/>
          <label for="ot0">None</label>
          <input type="radio" name="ot" id="ot1" value="1" />
          <label for="ot1">Direct Positive</label>
          <input type="radio" name="ot" id="ot2" value="2" />
          <label for="ot2">Direct Negative</label>
          <input type="radio" name="ot" id="ot3" value="3" />
          <label for="ot3">OpenSprinkler</label>
        </fieldset>
      </div>

      <div id="tempBaselinediv" data-role="fieldcontain">
        <label for="tempBaseline">Temperature Baseline</label>
        <input name="tempBaseline" id="tempBaseline" size="3" value="70" />
      </div>

      <div id="biasTempdiv" data-role="fieldcontain">
        <label for="biasTemp">Temperature Bias</label>
        <input name="biasTemp" id="biasTemp" size="3" value="" />
      </div>

      <div id="biasHumiddiv" data-role="fieldcontain">
        <label for="biasHumid">Humidity Bias</label>
        <input name="biasHumid" id="biasHumid" size="3" value="" />
      </div>

      <div id="biasRaindiv" data-role="fieldcontain">
        <label for="biasRain">Rain Bias</label>
        <input name="biasRain" id="biasRain" size="3" value="" />
      </div>





    </form>
    <p>Note: Settings do not save until you click "OK" at the top.</p>
  </div> <!-- /content -->
  <div data-role="footer" class="footer-docs" data-theme="a">
    <p>Powered by <a href="https://github.com/interbiznw/sprinklers_pi/wiki">Sprinklers Pi</a> <span id="version"></span></p>
  </div>
</div> <!-- /page -->
</body>

</html>
